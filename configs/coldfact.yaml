# 每日冷知识。定位：让人想转述的反直觉事实（谈资 + 画面改写）。
# mode: series 走「找一条 → 卡片 → 小红书文案」，不走选词量和长文质检。

product:
  id: "coldfact"
  name: "每日冷知识"
  # Pages 源是 /docs，公网路径对应 docs/series/coldfact/。
  # 官网反代 docs/ 时请排除 /series/，避免冷知识进 yibelin。
  domain: "https://zwtyai.github.io/seo-agent/series/coldfact/"
  description: "每天一条让人想转述的反直觉事实：有画面、可核对，读完想跟人说一句"
  mode: series

# 每天按北京时间切目录，一次跑满 3 条。
# 暂时关闭存活探测（grounding 有摘要但探针常 403/超时）；仍会尝试解开 grounding 跳转链。
series:
  batch_size: 3
  timezone: "Asia/Shanghai"
  require_live_source: false

keyword_strategy:
  # 谈资优先；要有画面改写，不要轻量生活辟谣。
  seed_keywords:
    - "反直觉事实"
    - "自然现象误解"
    - "感官错觉"
    - "日常误判"
  scene_hints:
    # 有画面、好转述的优先
    - "天气雷电与自然现象"
    - "材料与物理小现象"
    - "感官与错觉"
    - "动植物与自然观察"
    - "人体结构常见误解"
    - "城市出行与距离错觉"
    - "数字与尺度直觉"
    - "穿衣鞋帽与体感物理"
    - "饮水口渴与冷热饮"
    - "时间节奏与拖延错觉"
    - "运动拉伸与热身误区"
    - "购物包装与消费习惯"
    - "宠物草木养护常识"
    - "家用小物机制反差"
    # 家务类保留但排后；必须有机制打脸，不要说明书
    - "厨房与食物"
    - "清洁与洗衣"
    - "睡眠与疲劳"
    - "收纳整理习惯"
  search_volume:
    min: 0
    max: 0
  keyword_difficulty:
    max: 100
  exclusions: []

content_strategy:
  types:
    - name: "冷知识卡片"
      priority: 1
  word_count:
    min: 80
    max: 520
  evidence_requirements:
    min_urls: 1
    min_data_points: 0
  product_mention:
    max_count: 0
    position: "ending"

knowledge_base:
  source: "knowledge_base/coldfact/"
  main_file: "voice.md"

quality_gates:
  keyword_gate:
    enabled: false
    require_question_type: false
    check_existing_titles: true
  claim_gate:
    enabled: false
    max_product_mentions: 0

seo:
  keyword_density:
    min: 0
    max: 1
  internal_links:
    enabled: false
    anchor_text: ""
    target_url: ""
  meta:
    title_max_length: 60
    description_max_length: 160

publishing:
  output_dir: "docs/series/coldfact/"
  static_site_origin: "https://zwtyai.github.io/seo-agent/series/coldfact"
  wordpress:
    enabled: false
  github:
    enabled: true
    repo: "zwtyai/seo-agent"
    branch: "main"
    docs_dir: "docs"
  # 只生成可复制粘贴的小红书笔记，不自动发帖。
  xiaohongshu:
    enabled: true
    tags:
      - "每日冷知识"
      - "日常误判"
      - "生活常识"

monitoring:
  gsc:
    enabled: false

agents:
  researcher:
    # 略提高，鼓励找更有画面的选题，少落生活小辟谣。
    temperature: 0.7
    use_grounding: true
  writer:
    temperature: 0.75
    style: "curious"
  editor:
    temperature: 0.3
    strictness: "low"
