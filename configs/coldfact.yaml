# 每日冷知识。定位：日常生活里可纠正的小误判。
# mode: series 走「找一条 → 卡片 → 小红书文案」，不走选词量和长文质检。

product:
  id: "coldfact"
  name: "每日冷知识"
  # Pages 源是 /docs，公网路径对应 docs/series/coldfact/。
  # 官网反代 docs/ 时请排除 /series/，避免冷知识进 yibelin。
  domain: "https://zwtyai.github.io/seo-agent/series/coldfact/"
  description: "每天一条，纠正一个反直觉但可核对的日常误判，读完要有「原来如此」"
  mode: series

# 每天按北京时间切目录，一次跑满 3 条。
# 暂时关闭存活探测（grounding 有摘要但探针常 403/超时）；仍会尝试解开 grounding 跳转链。
series:
  batch_size: 3
  timezone: "Asia/Shanghai"
  require_live_source: false

keyword_strategy:
  # 日常生活习惯全覆盖；要有认知落差。厨房/洗衣/睡眠只是其中几格，靠轮换摊开。
  seed_keywords:
    - "日常误判"
    - "反直觉常识"
    - "生活习惯误解"
    - "常见误解纠正"
  scene_hints:
    # 先轮换这些，把「日子里处处都有误判」摊开
    - "感官与错觉"
    - "材料与物理小现象"
    - "动植物与自然观察"
    - "天气空气与体感"
    - "城市出行与通勤"
    - "购物包装与消费习惯"
    - "穿衣鞋帽与体感"
    - "饮水口渴与冷热饮"
    - "时间节奏与拖延错觉"
    - "运动拉伸与热身误区"
    - "坐姿站姿与办公习惯"
    - "视力用眼与灯光"
    - "声音气味与环境"
    - "钱币找零与数字直觉"
    - "社交礼仪与排队习惯"
    - "宠物草木养护常识"
    - "家用小物用法"
    - "人体常见误解"
    - "数字屏幕习惯"
    # 家务类保留，但排后面，避免连着三天都在冰箱洗衣机
    - "厨房与食物"
    - "清洁与洗衣"
    - "睡眠与疲劳"
    - "收纳整理习惯"
  search_volume:
    min: 0
    max: 0
  keyword_difficulty:
    max: 100
  exclusions: []

content_strategy:
  types:
    - name: "冷知识卡片"
      priority: 1
  word_count:
    min: 80
    max: 520
  evidence_requirements:
    min_urls: 1
    min_data_points: 0
  product_mention:
    max_count: 0
    position: "ending"

knowledge_base:
  source: "knowledge_base/coldfact/"
  main_file: "voice.md"

quality_gates:
  keyword_gate:
    enabled: false
    require_question_type: false
    check_existing_titles: true
  claim_gate:
    enabled: false
    max_product_mentions: 0

seo:
  keyword_density:
    min: 0
    max: 1
  internal_links:
    enabled: false
    anchor_text: ""
    target_url: ""
  meta:
    title_max_length: 60
    description_max_length: 160

publishing:
  output_dir: "docs/series/coldfact/"
  static_site_origin: "https://zwtyai.github.io/seo-agent/series/coldfact"
  wordpress:
    enabled: false
  github:
    enabled: true
    repo: "zwtyai/seo-agent"
    branch: "main"
    docs_dir: "docs"
  # 只生成可复制粘贴的小红书笔记，不自动发帖。
  xiaohongshu:
    enabled: true
    tags:
      - "每日冷知识"
      - "日常误判"
      - "生活常识"

monitoring:
  gsc:
    enabled: false

agents:
  researcher:
    # 略提高，避免总落在同几条家务提醒上。
    temperature: 0.65
    use_grounding: true
  writer:
    temperature: 0.75
    style: "curious"
  editor:
    temperature: 0.3
    strictness: "low"
