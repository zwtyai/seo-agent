# 每日冷知识。定位：日常生活里可纠正的小误判。
# mode: series 走「找一条 → 卡片 → 小红书文案」，不走选词量和长文质检。

product:
  id: "coldfact"
  name: "每日冷知识"
  # Pages 源是 /docs，公网路径对应 docs/series/coldfact/。
  # 官网反代 docs/ 时请排除 /series/，避免冷知识进 yibelin。
  domain: "https://zwtyai.github.io/seo-agent/series/coldfact/"
  description: "每天一条，纠正一个日常生活里的小误判"
  mode: series

# 每天按北京时间切目录，一次跑满 3 条；来源 URL 必须最终 HTTP 200。
series:
  batch_size: 3
  timezone: "Asia/Shanghai"
  require_live_source: true

keyword_strategy:
  # 主定位是日常误判；人体常识只作配菜子桶。
  seed_keywords:
    - "日常误判"
    - "生活常识纠正"
  scene_hints:
    - "厨房与食物"
    - "清洁与洗衣"
    - "睡眠与疲劳"
    - "家用小物用法"
    - "人体常见误解"
  search_volume:
    min: 0
    max: 0
  keyword_difficulty:
    max: 100
  exclusions: []

content_strategy:
  types:
    - name: "冷知识卡片"
      priority: 1
  word_count:
    min: 80
    max: 520
  evidence_requirements:
    min_urls: 1
    min_data_points: 0
  product_mention:
    max_count: 0
    position: "ending"

knowledge_base:
  source: "knowledge_base/coldfact/"
  main_file: "voice.md"

quality_gates:
  keyword_gate:
    enabled: false
    require_question_type: false
    check_existing_titles: true
  claim_gate:
    enabled: false
    max_product_mentions: 0

seo:
  keyword_density:
    min: 0
    max: 1
  internal_links:
    enabled: false
    anchor_text: ""
    target_url: ""
  meta:
    title_max_length: 60
    description_max_length: 160

publishing:
  output_dir: "docs/series/coldfact/"
  static_site_origin: "https://zwtyai.github.io/seo-agent/series/coldfact"
  wordpress:
    enabled: false
  github:
    enabled: true
    repo: "zwtyai/seo-agent"
    branch: "main"
    docs_dir: "docs"
  # 只生成可复制粘贴的小红书笔记，不自动发帖。
  xiaohongshu:
    enabled: true
    tags:
      - "每日冷知识"
      - "日常误判"
      - "生活常识"

monitoring:
  gsc:
    enabled: false

agents:
  researcher:
    temperature: 0.4
    use_grounding: true
  writer:
    temperature: 0.7
    style: "curious"
  editor:
    temperature: 0.3
    strictness: "low"
