# 工具导航站 SEO配置

product:
  id: "toolnav"
  name: "AI工具导航"
  domain: "https://toolnav.example.com"
  description: "精选AI工具推荐与评测"

keyword_strategy:
  seed_keywords:
    - "AI工具"
    - "效率工具"
    - "在线工具"
  
  keyword_types:
    - "推荐型"                   # 最好的XX工具
    - "对比型"                   # XX vs YY
    - "场景型"                   # 适合XX的工具
  
  search_volume:
    min: 500                     # 导航站需要更高流量
    max: 10000
  
  keyword_difficulty:
    max: 40
  
  exclusions:
    - "工具"                     # 单独的"工具"太宽

content_strategy:
  types:
    - name: "对比评测型"         # 工具对比
      priority: 1
    - name: "深度分析型"         # 工具详评
      priority: 2
    - name: "教程指南型"         # 如何选工具
      priority: 3
    - name: "FAQ型"
      priority: 4
    - name: "案例故事型"
      priority: 5
  
  word_count:
    min: 1200                    # 评测需要更长
    max: 2500
  
  evidence_requirements:
    min_urls: 5                  # 需要更多工具链接
    min_data_points: 3           # 对比数据更多
  
  product_mention:
    max_count: 0                 # 导航站不推自己产品
    position: "none"

knowledge_base:
  source: "knowledge_base/toolnav/"
  main_file: "tools_database.json"  # JSON格式的工具库
  
  # 导航站特殊配置
  tool_categories:
    - "AI写作"
    - "图片生成"
    - "视频编辑"
    - "PDF处理"
    - "数据分析"

quality_gates:
  keyword_gate:
    enabled: true
    require_question_type: false  # 允许各种类型
    check_existing_titles: true
  
  claim_gate:
    enabled: true
    forbidden_hype:              # 导航站要客观
      - "最强"
      - "碾压"
      - "秒杀"
    max_product_mentions: 0      # 不提自己

seo:
  keyword_density:
    min: 0.015
    max: 0.025
  
  internal_links:
    enabled: true
    strategy: "related_tools"    # 链接到相关工具页
  
  schema:                        # 导航站特殊schema
    article: true
    item_list: true              # 工具列表
    software_application: true   # 单个工具页

publishing:
  output_dir: "outputs/toolnav/docs/"
  static_site_origin: "https://toolnav.example.com"
  
  github:
    enabled: true
    repo: "your-org/toolnav-seo"
    branch: "main"
    docs_dir: "docs"

monitoring:
  gsc:
    enabled: true
    site_url: "sc-domain:toolnav.example.com"
    lookback_days: 7

# ============ 导航站特殊配置 ============
toolnav_specific:
  auto_update_tools: true        # 自动更新工具信息
  tool_sources:                  # 工具信息来源
    - "Product Hunt"
    - "Hacker News"
    - "GitHub Trending"
  
  affiliate_links:               # 联盟链接配置
    enabled: false
    disclosure: "本文包含联盟链接"
