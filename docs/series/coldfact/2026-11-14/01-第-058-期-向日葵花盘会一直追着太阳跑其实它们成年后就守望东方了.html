<h1>第 058 期 · 向日葵花盘会一直追着太阳跑？其实它们成年后就「守望东方」了</h1>
<p>我们总以为向日葵的花盘会一整天跟着太阳从东转到西，就像向日葵的名字一样。但其实，这种忙碌的“追日”行为只发生在幼年期的向日葵身上。一旦它们成熟并完全绽放，花盘就会停止转动，固定面向东方。<br />
带走一句：下次看到整片向日葵田都朝着一个方向时，别再以为它们在随时追日，它们只是在以最有效的方式，迎接清晨第一缕阳光，吸引传粉昆虫。<br />
来源：<a href="https://www.britannica.com/plant/sunflower">Britannica - Sunflower</a></p>
