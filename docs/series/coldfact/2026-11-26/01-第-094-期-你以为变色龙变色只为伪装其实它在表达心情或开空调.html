<h1>第 094 期 · 你以为变色龙变色只为伪装？其实它在「表达心情」或「开空调」</h1>
<p>很多人以为变色龙变色是为了更好地融入环境，躲避捕食者或捕食猎物。但实际上，除了伪装，它们变色更像是「情绪板」和「空调」：通过改变体色来表达情绪（比如兴奋或恐惧），传递信息（求偶或宣示地位），甚至根据环境温度调节体温（晒太阳时变深吸热，过热时变浅散热）。</p>
<p>带走一句：下次看到变色龙变色，别只以为它在捉迷藏，它可能正在「表达心情」或「调整体感」。<br />
来源：<a href="https://terraplaza.com/en/blog/chameleon-color-change-the-biggest-myths">Terraplaza</a></p>
