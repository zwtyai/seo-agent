<h1>第 067 期 · 狗狗的世界不是黑白片，而是「蓝黄滤镜」</h1>
<p>很多人以为狗狗眼中的世界是黑白色的，但其实它们也能看到颜色，只是和我们人类的「七彩世界」不太一样。狗狗的视网膜里只有两种视锥细胞，所以它们主要能分辨蓝色和黄色，而我们能看到的红色和绿色，在它们眼里可能就变成了棕色或灰色。</p>
<p>带走一句：下次给狗狗挑玩具，别再以为红色最醒目了，它们可能更容易发现蓝色的球，或者黄色的飞盘。<br />
来源：<a href="https://www.akc.org/expert-advice/health/can-dogs-see-color/">American Kennel Club (AKC)</a></p>
