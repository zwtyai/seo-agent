<h1>第 078 期 · 车在“怪坡”自动上行？其实是眼睛被「骗」了</h1>
<p>很多人在被称为“怪坡”的地方，会看到熄火的汽车自动“上坡”，甚至水流都往高处走，感觉像是某种神秘力量在牵引。但实际上，这并非反重力现象，而是周围地形和环境带来的「视觉错觉」。经过专业测量，这些看起来“上坡”的路段，其实是向下倾斜的，只是我们的眼睛被欺骗，将下坡误判成了上坡。</p>
<p>带走一句：下次遇到“怪坡”，别急着惊叹超自然，不妨用科学的眼光重新审视周围环境，你会发现眼睛有时也会“骗人”。</p>
