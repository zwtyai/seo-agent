<h1>第 077 期 · 血管看起来是蓝色？那只是光线在「变魔术」</h1>
<p>我们常以为皮肤下泛青的血管里流淌着“蓝色的血”，甚至觉得是缺氧导致。但其实，人体内的血液从始至终都是红色的，只是含氧量高时亮红，低时呈暗红。你看到的蓝色，是光线穿透皮肤时，短波长的蓝光被散射反射，长波长的红光则被血液吸收，最终在你眼中呈现出的视觉错觉。<br />
带走一句：下次再看到手腕上的“青筋”，别再以为那是蓝血，那只是皮肤和光线共同上演的一场视觉戏法。<br />
来源：<a href="https://www.sp.gov.cn/kpxx/kpdyjj/202601/t20260112_1772183.html">双牌县人民政府 (科普中国)</a></p>
