<h1>第 028 期 · 开车开窗更省油？高速时反而更费油</h1>
<p>很多人觉得开车开窗通风，总比开空调省油。但实际上，这得看车速。在市区低速行驶（通常低于 60-80 公里/小时）时，开窗确实能省油。可一旦车速超过 80 公里/小时，开窗会大大增加空气阻力，这时开窗反而比开空调更费油，甚至可能每百公里多消耗约 2 升燃油。</p>
<p>带走一句：下次开车，别再默认开窗就省油了：低速开窗，高速开空调，才是省油又舒服的办法。</p>
