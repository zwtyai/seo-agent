<h1>第 027 期 · 喝酒暖身是错觉，体温反会下降</h1>
<p>天冷时，不少人习惯喝点酒暖身，觉得酒下肚后身体就热乎了。但这种温暖感其实是一种错觉。酒精会刺激血管扩张，让血液流向皮肤表面，带来短暂的发热和脸红，但同时也会加速身体热量从体表散失，导致身体的核心温度反而下降，增加失温的风险。</p>
<p>带走一句：下次天冷想取暖，别再指望靠喝酒了，那只会让你感觉更热，实际却更快流失体温。</p>
<p>来源：<a href="https://www.mohw.gov.tw/cp-16-56317-1.html">卫生福利部丰原医院：喝酒可以暖身医师：别再一直误传下去</a></p>
