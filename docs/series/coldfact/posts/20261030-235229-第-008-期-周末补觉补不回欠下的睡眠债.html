<h1>第 008 期 · 周末补觉，补不回欠下的睡眠债</h1>
<p>你是不是也指望周末多睡会儿，就能把一周的觉都补回来？其实，周末睡再多，也只能暂时缓解疲劳，改善下情绪。那些工作日里长期缺觉对身体代谢、认知功能和激素平衡造成的深层影响，光靠周末补觉是很难完全弥补的。</p>
<p>带走一句：别再以为周末大睡一场就能彻底还清睡眠债了，更重要的是每天都睡饱，从源头避免熬夜。<br />
来源：<a href="https://health.clevelandclinic.org/can-you-really-catch-up-on-sleep/">Cleveland Clinic (克利夫兰诊所)</a></p>
