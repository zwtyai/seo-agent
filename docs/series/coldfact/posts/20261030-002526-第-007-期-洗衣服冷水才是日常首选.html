<h1>第 007 期 · 洗衣服，冷水才是日常首选</h1>
<p>你可能觉得热水洗衣服才干净，但对多数日常衣物来说，冷水洗涤不仅清洁力足够，还能更好地保护衣物纤维和颜色，防止缩水和褪色。现代洗衣液中的酶在冷水中也能发挥作用。特别是对付血渍、汗渍这类蛋白质污渍，冷水效果比热水更好，因为热水反而会让它们凝固，更难去除。</p>
<p>带走一句：下次洗衣服，别再默认热水了，日常衣物冷水洗更省电、护衣，也能洗干净。</p>
