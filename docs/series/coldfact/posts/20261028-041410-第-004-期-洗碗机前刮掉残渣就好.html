<h1>第 004 期 · 洗碗机前，刮掉残渣就好</h1>
<p>现代洗碗机和专用洗涤剂，其实就是为了处理带食物残渣的餐具而设计的。如果你在放进去之前过度冲洗，洗碗机可能会因为感应器误判脏污程度，选择更轻的模式，或者让洗涤剂里的酶无法充分发挥作用，结果反而洗不干净。</p>
<p>带走一句：下次用洗碗机，别再把碗碟冲得干干净净了。把大块的食物残渣刮掉，直接放进去，省水省力，还能让洗涤剂更好地工作。</p>
