<h1>第 005 期 · 掰手指不会导致关节炎</h1>
<p>掰手指时发出咔咔声，很多人都担心这会磨损关节，导致关节炎。但其实，关节发出响声，只是关节液里的气泡在形成和破裂。多项研究表明，这个习惯并不会增加你患关节炎的风险。</p>
<p>带走一句：下次再有人告诉你掰手指会得关节炎，你可以放心地说，这只是个流传很久的误解。</p>
