<h1>第 009 期 · 西红柿放冰箱，香气和甜味会偷偷溜走</h1>
<p>把没切开的西红柿放进冰箱，低温会抑制它们产生风味物质的酶，导致西红柿特有的香气和甜味大大减少，口感也会变软。有研究发现，西红柿在5℃下冷藏一周，它们65%的挥发性香气物质就消失了，就算拿出来放回室温也回不去了。</p>
<p>带走一句：下次买回未切开的西红柿，如果不是当天吃，就放室温阴凉处。只有切开或急需短期保鲜的，才考虑冷藏。</p>
