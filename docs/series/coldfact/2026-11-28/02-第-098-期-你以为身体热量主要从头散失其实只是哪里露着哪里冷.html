<h1>第 098 期 · 你以为身体热量主要从头散失？其实只是「哪里露着哪里冷」</h1>
<p>我们常以为，寒冷时身体大部分热量都从头部散失，戴帽子是保暖首选。但事实是，头部散热与身体其他暴露部位并无不同，都按表面积比例散发热量。这个误解可能来自一项实验：受试者全身包裹严实，唯独头部暴露，这才让头部成了主要散热点。<br />
带走一句：下次觉得冷的时候，别再只顾着戴帽子了，身体哪里露着哪里就冷，其他暴露部位的保暖也同样重要。<br />
来源：<a href="https://www.theguardian.com/science/2008/dec/17/medical-myths-hats-heat-loss">The Guardian</a></p>
