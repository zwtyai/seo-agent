<h1>第 031 期 · 口渴时才喝水？身体可能已经轻微脱水了</h1>
<p>很多人以为口渴是身体需要补水的第一个信号。但事实是，当你感到口渴时，身体通常已经流失了1%到2%的水分，处于轻度脱水状态。口渴其实是一个迟到的预警信号，对老年人来说，这种口渴感可能还会更不敏感。<br />
带走一句：下次别再等到口干舌燥才找水喝，主动规律补水才能更好地维持身体水分平衡。<br />
来源：<a href="https://my.clevelandclinic.org/health/diseases/9214-dehydration">Cleveland Clinic</a></p>
