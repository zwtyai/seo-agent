<h1>第 070 期 · 毛巾越洗越硬，可能不是没洗干净，而是你加了「柔顺剂」</h1>
<p>你是不是也习惯给毛巾加柔顺剂，想让它更柔软蓬松？但实际上，柔顺剂会在毛巾纤维上形成一层薄薄的蜡状涂层，阻碍水分渗透，大大降低毛巾的吸水能力。时间久了，毛巾不仅吸水性变差，还会变得滑腻甚至发硬。同样，运动服如果加了柔顺剂，也会堵塞纤维孔隙，失去吸湿排汗的功能。</p>
<p>带走一句：下次洗毛巾或运动服时，别再加柔顺剂了，不然它们可能就成了“中看不中用”的摆设。<br />
来源：<a href="https://hencely.com/why-you-should-not-use-fabric-softener-on-towels/">Hencely Home</a></p>
