<h1>第 090 期 · 你以为收纳从买盒子开始？其实它可能让你「越收越乱」</h1>
<p>很多人一看到家里乱，第一反应就是去买各种漂亮的收纳盒，觉得有了它们就能让家变得整洁有序。但实际上，在没有彻底清理、分类和丢弃不需要的物品之前，这些收纳工具往往只是把杂物从一个地方转移到另一个地方。更麻烦的是，空置的收纳空间反而会诱导你囤积更多东西，让家看起来“有秩序”，却依然拥挤，甚至造成二次浪费。<br />
带走一句：下次想整理时，别急着逛收纳区，先问问自己“哪些东西可以扔掉？”<br />
来源：<a href="https://www.haohaozhu.cn/post/6190847936279611382">好好住</a></p>
