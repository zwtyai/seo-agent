<h1>第 062 期 · 沙漠里穿黑袍，可能不比穿白袍热多少</h1>
<p>很多人觉得，大热天穿黑色衣服会更吸热，所以肯定比白色衣服热。但其实，在沙漠那种又热又晒还刮风的环境里，贝都因人穿的宽松黑袍，体感上并不会比白袍更热。虽然黑袍吸收了更多阳光，但因为宽松，热量能通过袍子和身体间的空气对流，以及袍子外表面的辐射，高效散出去，最后穿黑穿白感觉差不多。</p>
<p>带走一句：下次在阳光下选衣服，别只盯着颜色，衣服的款式是否宽松、能否促进空气流通，对散热的影响可能比你想象的更大。</p>
<p>来源：<a href="https://www.scientificamerican.com/article/why-do-bedouins-wear-black/">Scientific American</a></p>
