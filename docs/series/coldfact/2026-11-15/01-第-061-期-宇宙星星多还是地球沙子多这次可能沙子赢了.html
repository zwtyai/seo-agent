<h1>第 061 期 · 宇宙星星多还是地球沙子多？这次可能沙子赢了</h1>
<p>很多人可能都听过一个说法，用“可观测宇宙的星星比地球沙粒还多”来形容宇宙的浩瀚。但其实，如果我们算上地球上所有的沙子——不光是海滩，还有沙漠、河床和海底的沙粒——那么我们脚下这颗星球的沙粒总数，很可能比头顶的恒星数量还要多得多。</p>
