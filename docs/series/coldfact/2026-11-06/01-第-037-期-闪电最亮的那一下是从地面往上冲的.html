<h1>第 037 期 · 闪电最亮的那一下，是从地面往上冲的</h1>
<p>我们总以为闪电是从天空中劈下来的，看到的光也好像是从云层向下延伸。但其实，我们肉眼看到的最亮、最壮观的那道闪电，被称为“回击”，它恰恰是从地面向云层高速向上发展的。虽然之前确实有肉眼几乎看不见的“先导”从云层向下探索路径，但一旦它与地面连接，强大的电流就会沿着这条路径从地面向上回击，发出耀眼的光芒。</p>
<p>带走一句：下次再看到闪电，可以想象那道耀眼的光芒，其实是大地向天空的一次强力“反击”，而不是单纯的“天打雷劈”。</p>
