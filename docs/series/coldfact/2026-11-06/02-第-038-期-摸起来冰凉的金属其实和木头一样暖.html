<h1>第 038 期 · 摸起来冰凉的金属，其实和木头一样暖</h1>
<p>你以为摸起来冰凉的金属，温度就比木头低？其实，在同一个房间里放久了，它们的温度是完全一样的。之所以觉得金属“冰”手，是因为它导热快，能迅速把你手上的热量带走，让你皮肤温度骤降。而木头导热慢，热量流失不明显，所以感觉没那么冷。</p>
<p>带走一句：下次再凭手感判断物体温度时，别再只看“冷热”，它更多反映的是你的热量被带走的速度。</p>
