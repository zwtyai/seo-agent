<h1>第 039 期 · 眼睛看世界，其实是“倒”着看的</h1>
<p>我们总以为眼睛像摄像机，直接拍下正立的世界。但实际上，晶状体会把外界图像上下颠倒、左右反转地投射到视网膜上。我们能看到正立的景象，不是大脑把它翻转回来了，而是大脑已经习惯了这种倒置信号，并把它解读成了我们熟悉的样子。</p>
<p>带走一句：下次看东西，别再以为眼睛只是简单地“拍摄”画面。你看到的世界，是大脑对倒置信号进行复杂解读和构建的结果，它远比你想象的更主动。</p>
