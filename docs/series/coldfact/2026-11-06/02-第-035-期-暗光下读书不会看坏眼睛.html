<h1>第 035 期 · 暗光下读书，不会“看坏”眼睛</h1>
<p>从小我们就被教导，在光线不足的地方看书会严重损害视力。但眼科专家指出，目前没有科学证据表明暗光阅读会导致眼睛永久性损伤或视力下降。虽然在光线不足的环境中，眼睛需要更努力聚焦，可能引起疲劳、干涩或酸胀等暂时不适，但这些症状在充分休息后通常会自行缓解，不会对眼睛结构造成长期损害。</p>
<p>带走一句：下次在光线不佳的环境下阅读时，无需担心会永久“看坏”眼睛，但如果感到不适，记得让眼睛及时休息。<br />
来源：<a href="https://www.zeiss.com.cn/vision-care/better-vision/health-prevention/reading-in-dim-light-damage-eyes.html">蔡司光学 (ZEISS Vision Care)</a></p>
