<h1>第 022 期 · 洗衣机不会自己洗干净</h1>
<p>很多人都以为洗衣机每次工作时，顺便就把自己也洗干净了。但其实，洗衣机内部会残留洗衣液、污垢和湿气，这些正是霉菌和细菌滋生的大本营，时间久了还会让衣服沾上异味。上海市疾控中心的一项调查就发现，使用半年以上的洗衣机，细菌和霉菌的检出率都非常高。</p>
<p>带走一句：别再以为洗衣机能“自洁”了，定期给它做个清洁，衣服才能真的洗干净。</p>
