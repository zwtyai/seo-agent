<h1>第 019 期 · 冰箱冷藏室的温度，别只看显示屏</h1>
<p>冰箱冷藏室的最佳温度是4°C或以下，这样才能有效抑制细菌，保证食物安全。但很多冰箱的显示屏或旋钮，可能无法准确反映内部的真实温度。</p>
<p>带走一句：下次别再只看冰箱上的数字了，买个便宜的冰箱专用温度计放进去，确保冷藏室实际温度稳定在4°C左右，才能真正为食物保驾护航。<br />
来源：<a href="https://www.fda.gov/consumers/consumer-updates/are-you-storing-food-safely">美国食品药品监督管理局 (FDA)</a></p>
