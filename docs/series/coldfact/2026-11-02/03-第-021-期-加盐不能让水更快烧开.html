<h1>第 021 期 · 加盐不能让水更快烧开</h1>
<p>往水里加少量食盐，其实会提高水的沸点，意味着水需要达到更高的温度才能沸腾。虽然盐水升温速度会略快，但这点优势通常会被它更高的沸点抵消掉。所以，日常烹饪中加的那点盐，对水烧开的时间影响微乎其微，甚至可能让水烧开得更慢。</p>
<p>带走一句：下次往锅里加盐煮水，主要是为了调味，别再指望它能帮你节省多少时间了。<br />
来源：<a href="https://www.livescience.com/56230-does-salt-make-water-boil-faster.html">Live Science</a></p>
