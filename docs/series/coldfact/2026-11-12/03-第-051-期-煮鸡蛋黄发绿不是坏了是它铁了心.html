<h1>第 051 期 · 煮鸡蛋黄发绿，不是坏了，是它“铁”了心</h1>
<p>每次煮完鸡蛋，切开看到蛋黄外围有一圈灰绿色，很多人会下意识觉得是鸡蛋变质了，或者煮坏了不能吃。但其实，这层绿边只是一个完全无害的化学反应。它是蛋黄里的铁和蛋白里的硫，在长时间或高温加热时结合成了硫化亚铁。</p>
<p>带走一句：下次再看到煮鸡蛋蛋黄发绿，别再担心它坏了，放心吃就好。</p>
