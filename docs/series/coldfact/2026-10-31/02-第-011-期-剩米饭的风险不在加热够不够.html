<h1>第 011 期 · 剩米饭的风险，不在加热够不够</h1>
<p>煮熟的米饭里，可能藏着蜡样芽孢杆菌的孢子。烹饪能杀死大部分细菌，但这些孢子很顽强，能存活下来。如果米饭在室温下放太久（通常超过两小时），这些孢子就会繁殖，并产生耐热毒素。再次加热米饭可以杀死细菌，但已经形成的毒素却无法破坏，而它们正是导致食物中毒的原因。</p>
<p>带走一句：别再以为剩米饭热透了就安全了，真正的风险在于它在室温下停留了多久。下次煮好米饭，记得尽快冷却并在两小时内放进冰箱。</p>
<p>来源：<a href="https://extension.umaine.edu/food-health/food-safety/reheated-rice-syndrome/">University of Maine Extension</a></p>
