<h1>第 012 期 · 洗衣液放太多，衣服反而会变脏</h1>
<p>我们总以为洗衣液多放点，衣服就能洗得更干净。但实际上，过量的洗衣液难以被彻底漂洗掉，它们会残留在衣物纤维里，让衣服摸起来发硬发黏，甚至更容易吸附灰尘，结果反而显得更脏了。多余的洗衣液还会给洗衣机内部留下残留，甚至可能刺激皮肤。<br />
带走一句：下次洗衣服时，别再凭感觉倒洗衣液了，看看包装上的用量说明，按需添加才最有效。<br />
