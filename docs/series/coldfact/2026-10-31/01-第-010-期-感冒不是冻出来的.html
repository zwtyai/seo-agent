<h1>第 010 期 · 感冒不是“冻”出来的</h1>
<p>你可能觉得天冷就容易感冒，但感冒的真正元凶是病毒，而不是低温本身。虽然冷空气会让我们呼吸道黏膜变脆弱，免疫力也可能降低，加上大家更爱待在室内增加病毒接触，这些都只是间接因素，寒冷本身并不会直接让你生病。</p>
<p>带走一句：下次天冷，别再只想着多穿衣服就能防感冒。记住，勤洗手、多通风、少接触病毒，才是预防感冒的关键。</p>
