<h1>第 015 期 · 棉签掏耳朵，可能帮了倒忙</h1>
<p>你可能以为棉签是掏耳朵的好帮手，但医学专家们普遍不建议用它清理耳道内部。实际上，棉签非但很难彻底清除耳垢，反而常常把它推向更深处，这可能导致堵塞，甚至损伤耳道皮肤或鼓膜，还会增加感染的风险。更重要的是，我们的耳朵有自我清洁能力，耳垢会随着日常咀嚼等动作自然排出。</p>
<p>带走一句：下次想清理耳朵时，别再用棉签或其他尖锐物品深入耳道了。如果觉得耳垢太多引起不适，最好还是交给专业医生处理。</p>
