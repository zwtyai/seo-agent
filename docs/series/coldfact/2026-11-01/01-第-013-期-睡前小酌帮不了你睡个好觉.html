<h1>第 013 期 · 睡前小酌，帮不了你睡个好觉</h1>
<p>很多人以为睡前喝点酒能睡得更好，但酒精虽然让你入睡快，却会严重破坏正常的睡眠结构。它会减少深度睡眠和快速眼动睡眠，导致你后半夜更容易醒，睡眠变得零碎、质量下降。所以，即使睡足了时间，第二天早上你可能还是会感到疲惫。</p>
<p>带走一句：如果你想睡个高质量的好觉，就别再指望睡前喝酒来助眠了，它只会让你醒来后更疲惫。</p>
