<h1>第 017 期 · 柔顺剂别乱用，毛巾和运动服会“罢工”</h1>
<p>织物柔顺剂能让衣物摸起来更软，因为它在纤维表面形成了一层薄膜。但这层膜对毛巾和运动服来说可不是好事，它会堵住毛巾的吸水孔，让毛巾越洗越不吸水，甚至油腻。对运动服来说，这层膜会破坏它排汗透气的功能，还可能让异味挥之不去。</p>
<p>带走一句：下次洗毛巾和运动服时，就让柔顺剂休息一下吧，它们会感谢你的。<br />
