name: Coldfact Daily Series

# 冷知识独立定时，避免和译比邻共用一个 schedule 矩阵时不好排查。
# UTC 00:00 ≈ 北京时间 08:00；一次跑满当天 3 条。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-coldfact:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run coldfact series (batch 3)
      env:
        GOOGLE_CREDENTIALS_ENC: ${{ secrets.GOOGLE_CREDENTIALS_ENC }}
        DOC2DOC_SECRETS_KEY: ${{ secrets.DOC2DOC_SECRETS_KEY }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        OTEL_SDK_DISABLED: true
        CREWAI_DISABLE_TELEMETRY: true
      run: |
        if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
          echo "$GOOGLE_CREDENTIALS_JSON" > /tmp/gcp-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
        fi
        export GOOGLE_GENAI_USE_VERTEXAI=true
        python main.py --product coldfact --step all

    - name: Publish docs via PR
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/
        if [ -d outputs ]; then
          git add outputs/
        fi
        if git diff --staged --quiet; then
          echo "No docs/ changes to commit"
          exit 0
        fi
        branch="chore/coldfact-docs-${GITHUB_RUN_ID}"
        git checkout -b "$branch"
        git commit -m "chore: publish coldfact day batch from Actions"
        git push -u origin HEAD
        pr_url=$(gh pr create \
          --base main \
          --head "$branch" \
          --title "chore: publish coldfact day batch from Actions" \
          --body "Automated coldfact docs publish from workflow run ${GITHUB_RUN_ID}.")
        echo "Opened $pr_url"
        gh pr merge "$pr_url" --squash --delete-branch
