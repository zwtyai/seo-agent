name: Yibelin SEO Automation Factory

on:
  schedule:
    # UTC 周日/二/四 18:00 ≈ 北京时间周一/三/五 02:00
    - cron: '0 18 * * 0,2,4'
  workflow_dispatch:

# 本 workflow 不监听 push，避免「提交 site/ → 再触发工厂」死循环
permissions:
  contents: write

jobs:
  run-seo-factory:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run SEO Factory
      env:
        GOOGLE_CREDENTIALS_ENC: ${{ secrets.GOOGLE_CREDENTIALS_ENC }}
        DOC2DOC_SECRETS_KEY: ${{ secrets.DOC2DOC_SECRETS_KEY }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        WP_URL: ${{ secrets.WP_URL }}
        GOOGLE_GSC_KEY_JSON: ${{ secrets.GOOGLE_GSC_KEY_JSON }}
        GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        OTEL_SDK_DISABLED: true
        CREWAI_DISABLE_TELEMETRY: true
      run: |
        if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
          echo "$GOOGLE_CREDENTIALS_JSON" > /tmp/gcp-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
        fi
        export GOOGLE_GENAI_USE_VERTEXAI=true
        python main.py

    # 把生成的 site/ 提交回仓库 → 可触发 pages.yml 部署
    - name: Commit static site
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add site/
        if git diff --staged --quiet; then
          echo "No site/ changes to commit"
        else
          git commit -m "chore: publish SEO static page from Actions"
          git push
        fi
