name: SEO Automation Factory

on:
  schedule:
    # UTC 周日/二/四 18:00 ≈ 北京时间周一/三/五 02:00。这条只跑译比邻。
    - cron: '0 18 * * 0,2,4'
    # UTC 每天 00:00 ≈ 北京时间 08:00。这条只跑每日冷知识。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      product:
        description: 要跑的产品
        required: true
        default: yibelin
        type: choice
        options:
          - yibelin
          - tranzify
          - toolnav
          - coldfact

# 本 workflow 不监听 push，避免「提交 site/ → 再触发工厂」死循环
# main 已开 PR-only 规则：docs 变更走分支 + PR merge，不能直推 main
permissions:
  contents: write
  pull-requests: write

jobs:
  run-seo-factory:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run SEO Factory
      env:
        GOOGLE_CREDENTIALS_ENC: ${{ secrets.GOOGLE_CREDENTIALS_ENC }}
        DOC2DOC_SECRETS_KEY: ${{ secrets.DOC2DOC_SECRETS_KEY }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        WP_URL: ${{ secrets.WP_URL }}
        GOOGLE_GSC_KEY_JSON: ${{ secrets.GOOGLE_GSC_KEY_JSON }}
        GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        OTEL_SDK_DISABLED: true
        CREWAI_DISABLE_TELEMETRY: true
      run: |
        if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
          echo "$GOOGLE_CREDENTIALS_JSON" > /tmp/gcp-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
        fi
        export GOOGLE_GENAI_USE_VERTEXAI=true
        PRODUCT="${{ github.event.inputs.product }}"
        if [ -z "$PRODUCT" ]; then
          case "${{ github.event.schedule }}" in
            "0 0 * * *") PRODUCT="coldfact" ;;
            *) PRODUCT="yibelin" ;;
          esac
        fi
        echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
        python main.py --product "$PRODUCT" --step all

    # 把生成的 docs/ 经 PR 合入 main → Pages（分支 /docs）自动更新
    # 若 org 禁止 Actions 用 GITHUB_TOKEN 开 PR，请配置 Secret GH_PAT（repo 权限的 classic PAT 或 fine-grained: contents+PRs）
    - name: Publish docs via PR
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/
        if [ -d outputs ]; then
          git add outputs/
        fi
        # 系列栏目（如冷知识）在 series/，故意不进 docs/，以免跟 yibelin 官网代理目录混在一起。
        if [ -d series ]; then
          git add series/
        fi
        if git diff --staged --quiet; then
          echo "No docs/ or series/ changes to commit"
          exit 0
        fi
        branch="chore/seo-docs-${GITHUB_RUN_ID}"
        git checkout -b "$branch"
        git commit -m "chore: publish ${PRODUCT:-seo} static page from Actions"
        git push -u origin HEAD
        pr_url=$(gh pr create \
          --base main \
          --head "$branch" \
          --title "chore: publish SEO static page from Actions" \
          --body "Automated docs publish from workflow run ${GITHUB_RUN_ID}.")
        echo "Opened $pr_url"
        gh pr merge "$pr_url" --squash --delete-branch
