<h1>第 001 期 · 舌头没有味觉地图，所有地方都能尝出所有味道</h1>
<p>你是不是也以为，舌尖尝甜味，舌根尝苦味？其实，这所谓的“味觉地图”是个误会。我们的舌头，不管哪个部位，上面的味蕾都能尝出甜、酸、苦、咸、鲜这五种基本味道。</p>
<p>这完全颠覆了我们从小在课本里学到的舌头分区尝味概念。</p>
